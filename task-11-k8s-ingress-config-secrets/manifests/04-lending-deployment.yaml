# A second service, so the ingress has two different backends to route between.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lending-page
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head><title>Lending service</title></head>
      <body style="font-family: sans-serif; text-align: center; margin-top: 12vh;">
        <h1>Lending service</h1>
        <p>A different backend, reached through the same ingress.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lending-web
  labels:
    app: library
    component: lending-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: library
      component: lending-web
  template:
    metadata:
      labels:
        app: library
        component: lending-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
      volumes:
        - name: page
          configMap:
            name: lending-page
---
apiVersion: v1
kind: Service
metadata:
  name: lending-web
spec:
  selector:
    app: library
    component: lending-web
  ports:
    - port: 80
      targetPort: 80
