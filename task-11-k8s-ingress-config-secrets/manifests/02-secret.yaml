# A secret looks like a configmap but is meant for credentials.
# stringData lets you write the plain value and let Kubernetes do the
# base64 encoding, which avoids the classic mistake further down.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-auth
type: Opaque
stringData:
  DB_USER: catalog_app
  DB_PASSWORD: s3cr3t-not-for-production
