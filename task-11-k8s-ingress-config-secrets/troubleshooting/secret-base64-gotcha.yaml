# Deliberately wrong. Anything under data: must already be base64.
# Writing the password in plain text here is rejected by the API server.
# The fix is either to base64 it, or to use stringData: and let
# Kubernetes encode it, which is what manifests/02-secret.yaml does.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db-auth-wrong
type: Opaque
data:
  DB_PASSWORD: s3cr3t-not-for-production
