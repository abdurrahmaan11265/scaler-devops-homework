# NodePort opens the same port on every node, so the app becomes reachable
# from outside the cluster at nodeIP:nodePort. The allowed range is 30000-32767.
apiVersion: v1
kind: Service
metadata:
  name: catalog-api-nodeport
  labels:
    app: library
    component: catalog
spec:
  type: NodePort
  selector:
    app: library
    component: catalog
  ports:
    - name: http
      port: 8080
      targetPort: 80
      nodePort: 30080
