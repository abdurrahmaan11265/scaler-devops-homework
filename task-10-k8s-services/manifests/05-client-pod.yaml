# A small pod with nslookup and wget in it, used to test DNS and connectivity
# from inside the cluster.
apiVersion: v1
kind: Pod
metadata:
  name: netshoot
  labels:
    app: library
    component: debug
spec:
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
