# Local run of the same image the pipeline builds.
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports: ["5000:5000"]
    environment:
      LIBRARY_NAME: "Campus Library (compose)"
      ADMIN_TOKEN: "local-dev-token"
      DATA_DIR: /data
    volumes:
      - books:/data
volumes:
  books: {}
