# Hammers the service in a loop so the pods actually use CPU.
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command: ["sh", "-c", "while true; do wget -q -O- http://cpu-worker > /dev/null; done"]
