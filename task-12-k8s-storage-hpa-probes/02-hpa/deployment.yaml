apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-worker
  template:
    metadata:
      labels:
        app: cpu-worker
    spec:
      containers:
        - name: php
          image: registry.k8s.io/hpa-example    # a php page that burns CPU on every request
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m          # the HPA percentage is measured against this
            limits:
              cpu: 300m
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-worker
spec:
  selector:
    app: cpu-worker
  ports:
    - port: 80
      targetPort: 80
