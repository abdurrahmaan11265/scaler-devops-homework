# emptyDir: scratch space that lives as long as the pod does.
# Two containers in the same pod share it, which is the usual reason to use one.
apiVersion: v1
kind: Pod
metadata:
  name: scratch-demo
spec:
  volumes:
    - name: scratch
      emptyDir: {}
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /scratch/log.txt; sleep 5; done"]
      volumeMounts:
        - name: scratch
          mountPath: /scratch
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: scratch
          mountPath: /scratch
