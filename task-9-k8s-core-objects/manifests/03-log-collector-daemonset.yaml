# A daemonset runs exactly one pod on every node. Used for things that are
# per machine rather than per application: log shippers, metrics agents, CNI.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-collector
  labels:
    app: library
    component: logging
spec:
  selector:
    matchLabels:
      app: library
      component: logging
  template:
    metadata:
      labels:
        app: library
        component: logging
    spec:
      containers:
        - name: collector
          image: busybox:1.36
          command:
            - sh
            - -c
            - while true; do echo "[collector] $(date -Iseconds) node=$NODE_NAME"; sleep 30; done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
