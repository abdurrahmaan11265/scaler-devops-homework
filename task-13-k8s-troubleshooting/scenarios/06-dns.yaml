# A client that looks up a service by the wrong namespace. The name is right,
# the service is in default, the client asks for it in library.
apiVersion: v1
kind: Pod
metadata:
  name: dns-client
  labels: {scenario: dns}
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "while true; do wget -qO- --timeout=3 http://catalog.library.svc.cluster.local || echo 'lookup failed'; sleep 10; done"]
