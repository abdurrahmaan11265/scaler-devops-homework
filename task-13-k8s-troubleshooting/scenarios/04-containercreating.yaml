# Mounts a ConfigMap that does not exist, so the pod sticks in ContainerCreating
# while the kubelet waits for the volume.
apiVersion: v1
kind: Pod
metadata:
  name: settings-reader
  labels: {scenario: containercreating}
spec:
  volumes:
    - name: cfg
      configMap:
        name: catalog-settigns
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: cfg
          mountPath: /etc/catalog
