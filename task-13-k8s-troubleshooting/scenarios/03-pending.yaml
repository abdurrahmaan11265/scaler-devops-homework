# Requests more memory than any node has, so the scheduler can never place it
# and it stays Pending. The events say exactly why.
apiVersion: v1
kind: Pod
metadata:
  name: analytics
  labels: {scenario: pending}
spec:
  containers:
    - name: analytics
      image: busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests:
          memory: "64Gi"
          cpu: "16"
