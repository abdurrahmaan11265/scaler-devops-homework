# The workload being monitored. Requests and limits are set so the CPU and
# memory panels mean something, and the probe gives Kubernetes a health signal.
apiVersion: v1
kind: Namespace
metadata:
  name: library
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-web
  namespace: library
  labels: {app: catalog-web}
spec:
  replicas: 2
  selector:
    matchLabels: {app: catalog-web}
  template:
    metadata:
      labels: {app: catalog-web}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-web
  namespace: library
spec:
  selector: {app: catalog-web}
  ports: [{port: 80, targetPort: 80}]
